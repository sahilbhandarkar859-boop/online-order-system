<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create an account</title>
  <style>
:root {
  --ink: #111111;
  --muted: #5f6368;
  --line: #d4d4d4;
  --bg: #ffffff;
  --error: #b3261e;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

.page {
  min-height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 32px 16px;
}

.card {
  width: 100%;
  max-width: 460px;
  padding: 40px 36px 32px;
  border: 1px solid var(--line);
  background: #fff;
}

h1 {
  margin: 0 0 28px;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-align: center;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.field { margin-bottom: 18px; }

.field label {
  display: block;
  margin-bottom: 6px;
  font-size: 14px;
  font-weight: 500;
}

.field input {
  width: 100%;
  height: 44px;
  padding: 0 12px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 0;
  outline: none;
}

.field input:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 1px var(--ink);
}

.field input.has-error { border-color: var(--error); }

.error {
  margin: 6px 0 0;
  font-size: 13px;
  color: var(--error);
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 4px 0 24px;
  font-size: 14px;
  cursor: pointer;
}

.checkbox input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--ink);
  cursor: pointer;
}

.register-btn {
  width: 100%;
  height: 48px;
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: #fff;
  background: #000;
  border: 1px solid #000;
  border-radius: 0;
  cursor: pointer;
}

.register-btn:hover { background: #2a2a2a; }

.register-btn:focus-visible {
  outline: 2px solid #000;
  outline-offset: 3px;
}

.login-text {
  margin: 20px 0 0;
  font-size: 14px;
  text-align: center;
  color: var(--muted);
}

.login-text a {
  color: var(--ink);
  font-weight: 600;
  text-decoration: underline;
}

@media (max-width: 480px) {
  .card { padding: 32px 20px 24px; border-left: 0; border-right: 0; }
  .row { grid-template-columns: 1fr; gap: 0; }
}
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

</body>
</html>
